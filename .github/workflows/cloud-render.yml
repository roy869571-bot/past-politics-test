name: Render video in GitHub cloud

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run render

      - uses: actions/upload-artifact@v4
        with:
          name: mossad-30s-video
          path: out/mossad-30s.mp4
          retention-days: 3
