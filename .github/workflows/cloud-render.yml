name: Render one-minute animated history video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install voice generator
        run: pip install edge-tts

      - name: Generate English narration
        run: python scripts/make_voice.py

      - name: Install Remotion dependencies
        run: npm install

      - name: Render MP4 in cloud
        run: npm run render

      - name: Upload finished MP4
        uses: actions/upload-artifact@v4
        with:
          name: mossad-one-minute-video
          path: out/mossad-one-minute.mp4
          retention-days: 3
